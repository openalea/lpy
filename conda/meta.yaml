{% set version = environ.get('SETUPTOOLS_SCM_PRETEND_VERSION', "0.0.0.dev") %}

package:
  name: openalea.lpy
  version: {{ version }}

source:
  path: ..

about:
  home: https://github.com/openalea/lpy
  license: Cecill-C
  summary: Lindenmayer Systems in Python package for OpenAlea.

build:
  string: py{{ PY_VER }}
  number: 0
  script:
    - {{ PYTHON }} -m pip install . --no-deps --no-build-isolation -vv
  entry_points:
    - lpy = openalea.lpy.gui.lpystudio:main
    - cpfg2lpy = openalea.lpy.cpfg_compat.cpfg2lpy:main

requirements:
  build:
    - {{ compiler('cxx') }}
    - {{ stdlib('c') }}
    - cmake
    - make                              # [unix]
  host:
    - python
    - pip
    - setuptools-scm
    - scikit-build-core
    - openalea.plantgl
    # libboost-devel and libboost-python-devel add libboost and libboost-python to run
    # (run_exports), qt-main adds itself (CMake links Qt Core and Concurrent).
    - libboost-devel
    - libboost-python-devel
    - qt-main
  run:
    - python
    # pinned to the host version (x.x) by the run_exports of openalea.plantgl
    - openalea.plantgl
    # imported at module level by the lpy GUI (also dependencies of openalea.plantgl)
    - pyopengl
    - pyqglviewer
    # the shell of the lpy GUI; brings ipython, ipykernel and jupyter_client
    - qtconsole
    - jsonschema

app:
  entry: lpy
  summary: Plant simulation software
  icon: icon_64x64.png

test:
  requires:
    - pytest
    # optional: openalea.lpy.tableparameterset (test/lpytest/tableparameters.lpy)
    - pandas
  imports:
    - openalea.lpy
  source_files:
    - test/
    - share/
  commands:
    - cd test
    - pytest -v --ignore=cembedding/test_cembedding.py --ignore=test_lsysparameter.py --ignore=test_pickle.py --ignore=test_predecessor_at_scale.py --ignore=test_parsing.py --ignore=test_regexpmatching.py --ignore=test_tree_matching.py --ignore=test_ui.py

